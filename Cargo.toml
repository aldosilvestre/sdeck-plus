[package]
name = "sdeck-plus"
version = "1.1.0"
edition = "2021"
license = "MIT"
description = "GTK4 control desk for Elgato Stream Deck devices on Linux"
repository = "https://github.com/aldosilvestre/sdeck-plus"
homepage = "https://aldosilvestre.github.io/sdeck-plus/"
readme = "README.md"
keywords = ["streamdeck", "elgato", "gtk4", "linux", "obs"]
categories = ["hardware-support", "gui"]

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_8"] }
pangocairo = "0.20"
hidapi = "2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
sha2 = "0.10"
base64 = "0.22"
async-channel = "2"
ksni = { version = "0.3", features = ["blocking"] }
tokio = { version = "1.53.3", features = ["rt", "time"] }
# Virtual deck HTTPS/WSS server: ring provider only (no aws-lc-rs), self-signed
# certificate, Argon2id password hashes, OS random bytes.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
getrandom = "0.3"
# QR code of the virtual deck's address in the header menu; no image/svg renderers.
qrcode = { version = "0.14", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.189"
